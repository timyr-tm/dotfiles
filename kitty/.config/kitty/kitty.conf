# Font
font_family FiraCode Nerd Font 
font_size 12
disable_ligatures never

# Cursor
cursor #89b4fa
cursor_shape beam

# Scrollbar
scrollbar always
scrollbar_hover_width 0.5
scrollbar_track_hover_opacity 0
scrollbar_handle_color #89b4fa

# Mouse
url_color #89b4fa

# Color scheme
foreground #cdd6f4
background #1e1e2e
background_opacity 0.75
selection_foreground #bac2de
selection_background #181825

color0 #313244
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #a6adc8
color8 #585b70
color9 #f37799
color10 #89d88b
color11 #ebd391
color12 #74a8fc
color13 #f2aede
color14 #6bd7ca
color15 #bac2de

mark1_foreground #11111b
mark1_background #b4befe
mark2_foreground #11111b
mark2_background #cba6f7
mark3_foreground #11111b
mark3_background #74c7ec

# Keyboard shortcuts
kitty_mod alt
map mod+c copy_to_clipboard
map mod+v paste_from_clipboard